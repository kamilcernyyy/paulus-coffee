.brand{position:fixed;top:calc(18px + env(safe-area-inset-top));left:calc(20px + env(safe-area-inset-left));z-index:3;line-height:0}
.brand img{height:clamp(30px,5.4vw,46px);width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}

.stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.paper{position:relative;width:min(88vw,62vh);aspect-ratio:350/483;container-type:inline-size;
  border-radius:clamp(10px,2vw,22px);overflow:hidden;transform:rotate(-1.4deg);will-change:transform;
  background:linear-gradient(158deg,#f7f3ea 0%,#ffe8d3 46%,#ff8a52 100%);
  box-shadow:0 32px 64px -20px rgba(18,7,3,.72),0 8px 22px rgba(18,7,3,.42)}

.grad{position:absolute;inset:0;z-index:0}
.grad::before,.grad::after{content:"";position:absolute;border-radius:50%;will-change:transform}
.grad::before{width:86cqw;height:86cqw;left:-14cqw;top:-18cqw;filter:blur(7cqw);
  background:radial-gradient(circle,rgba(255,168,110,.5),rgba(255,168,110,0) 68%)}
.grad::after{width:96cqw;height:96cqw;right:-22cqw;bottom:-26cqw;filter:blur(7cqw);
  background:radial-gradient(circle,rgba(255,92,44,.62),rgba(255,92,44,0) 66%)}

.pool{position:absolute;z-index:1;top:93cqw;left:14cqw;width:72cqw;height:auto;opacity:.95}

.content{position:relative;z-index:2;height:100%;padding:6.5cqw 6.5cqw 0}
.logo{height:10cqw;width:auto;display:block}
.eyebrow{font-family:Bricolage;font-weight:600;font-size:8.2cqw;line-height:1;color:#733635;margin-top:4.5cqw}
.headline{font-family:Bricolage;font-weight:800;font-size:23cqw;line-height:.93;letter-spacing:-.01em;color:#ff6037;margin-top:1.5cqw}
.tagline{font-family:Instrument;font-weight:500;font-size:4.7cqw;line-height:1.28;color:#351e1c;margin-top:4.5cqw;max-width:82%}

@media (prefers-reduced-motion:no-preference){
  #brick{animation:brickfloat 26s ease-in-out infinite alternate}
  .paper{animation:float 7.5s ease-in-out infinite}
  .grad::before{animation:blob1 16s ease-in-out infinite alternate}
  .grad::after{animation:blob2 21s ease-in-out infinite alternate}
}
@keyframes brickfloat{from{transform:scale(1.05) translate3d(-1%,-.8%,0)}to{transform:scale(1.09) translate3d(1.1%,.9%,0)}}
